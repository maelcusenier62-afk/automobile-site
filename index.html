
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoWorld | Catalogue automobile</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #ffffff;
    color: #222222;
    font-family: Arial, sans-serif;
}

header {
    background: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e5e5e5;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #d71920;
    letter-spacing: 2px;
}

nav a {
    color: #333;
    text-decoration: none;
    margin-left: 25px;
    font-weight: bold;
}

nav a:hover {
    color: #d71920;
}

/* ACCUEIL AVEC PHOTO MERCEDES */

.hero {
    min-height: 430px;
    padding: 75px 7%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;

    background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.55)),
    url("https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&w=2000&q=85");

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

.hero h1 {
    font-size: 55px;
    margin-bottom: 18px;
    text-shadow: 0 2px 10px black;
}

.hero h1 span {
    color: #ff4248;
}

.hero p {
    font-size: 18px;
    text-shadow: 0 2px 8px black;
}

/* CATALOGUE */

.section {
    padding: 45px 7%;
}

.section h2 {
    font-size: 29px;
    margin-bottom: 12px;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
}

.search {
    width: 100%;
    padding: 17px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 9px;
    color: #222;
    font-size: 16px;
    outline: none;
    margin-bottom: 20px;
}

.search:focus {
    border-color: #d71920;
}

.filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.filters button {
    background: #f3f3f3;
    color: #333;
    border: 1px solid #ddd;
    padding: 10px 15px;
    border-radius: 7px;
    cursor: pointer;
}

.filters button.active,
.filters button:hover {
    background: #d71920;
    color: white;
    border-color: #d71920;
}

.count {
    color: #777;
    margin-bottom: 20px;
}

/* CARTES DES MARQUES */

.brands {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 15px;
}

.brand {
    background: white;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    min-height: 145px;
    padding: 18px 10px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;

    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.brand:hover {
    transform: translateY(-5px);
    border-color: #d71920;
    box-shadow: 0 5px 15px rgba(0,0,0,0.10);
}

.brand img {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.brand-name {
    font-weight: bold;
    font-size: 14px;
    text-align: center;
}

.initial {
    width: 65px;
    height: 65px;
    border-radius: 12px;
    background: #f1f1f1;
    color: #333;
    border: 1px solid #ddd;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
    font-size: 21px;
}

/* DETAILS */

#details {
    display: none;
    background: #f8f8f8;
    border: 1px solid #ddd;
    border-left: 4px solid #d71920;
    border-radius: 12px;
    padding: 25px;
    margin-top: 30px;
}

#details h3 {
    font-size: 25px;
    margin-bottom: 12px;
}

#details p {
    color: #555;
    line-height: 1.6;
}

#details button {
    margin-top: 15px;
    padding: 10px 18px;
    background: #d71920;
    border: none;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

.empty {
    color: #777;
    padding: 30px 0;
    display: none;
}

footer {
    background: #f5f5f5;
    padding: 30px;
    text-align: center;
    color: #777;
    margin-top: 50px;
}

@media(max-width: 600px) {
    .hero {
        min-height: 320px;
    }

    .hero h1 {
        font-size: 34px;
    }

    header {
        flex-direction: column;
        gap: 20px;
    }

    nav a {
        margin: 0 8px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">AUTOWORLD</div>

    <nav>
        <a href="#accueil">Accueil</a>
        <a href="#marques">Marques</a>
    </nav>
</header>

<!-- PAGE D'ACCUEIL -->

<section class="hero" id="accueil">
    <div>
        <h1>PASSION <span>AUTOMOBILE</span></h1>
        <p>Explorez les plus grandes marques automobiles du monde.</p>
    </div>
</section>

<!-- CATALOGUE DES MARQUES -->

<section class="section" id="marques">

    <h2>Les marques automobiles</h2>

    <p class="subtitle">
        Découvrez les constructeurs automobiles du monde entier.
    </p>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="Rechercher une marque... (ex : Porsche, Ferrari, BMW)"
    >

    <div class="filters">
        <button class="active" data-letter="all">Toutes</button>
        <button data-letter="A">A</button>
        <button data-letter="B">B</button>
        <button data-letter="C">C</button>
        <button data-letter="D">D</button>
        <button data-letter="F">F</button>
        <button data-letter="G">G</button>
        <button data-letter="H">H</button>
        <button data-letter="I">I</button>
        <button data-letter="J">J</button>
        <button data-letter="K">K</button>
        <button data-letter="L">L</button>
        <button data-letter="M">M</button>
        <button data-letter="N">N</button>
        <button data-letter="O">O</button>
        <button data-letter="P">P</button>
        <button data-letter="R">R</button>
        <button data-letter="S">S</button>
        <button data-letter="T">T</button>
        <button data-letter="V">V</button>
    </div>

    <p class="count" id="count"></p>

    <div class="brands" id="brands"></div>

    <p class="empty" id="empty">
        Aucune marque trouvée.
    </p>

    <div id="details">
        <h3 id="brandTitle"></h3>
        <p id="brandDescription"></p>
        <button onclick="closeDetails()">Fermer</button>
    </div>

</section>

<footer>
    © 2026 AutoWorld - Passion Automobile
</footer>

<script>

/* LISTE DES MARQUES */

const marques = [

    ["Abarth","abarth"],
    ["Alfa Romeo","alfaromeo"],
    ["Alpine","alpine"],
    ["Aston Martin","astonmartin"],
    ["Audi","audi"],
    ["Bentley","bentley"],
    ["BMW","bmw"],
    ["Bugatti","bugatti"],
    ["BYD","byd"],
    ["Cadillac","cadillac"],
    ["Chevrolet","chevrolet"],
    ["Citroën","citroen"],
    ["Cupra","cupra"],
    ["Dacia","dacia"],
    ["Dodge","dodge"],
    ["DS Automobiles","dsautomobiles"],
    ["Ferrari","ferrari"],
    ["Fiat","fiat"],
    ["Ford","ford"],
    ["GMC","gmc"],
    ["Honda","honda"],
    ["Hyundai","hyundai"],
    ["Infiniti","infiniti"],
    ["Isuzu","isuzu"],
    ["Jaguar","jaguar"],
    ["Jeep","jeep"],
    ["Kia","kia"],
    ["Koenigsegg","koenigsegg"],
    ["KTM","ktm"],
    ["Lamborghini","lamborghini"],
    ["Lancia","lancia"],
    ["Land Rover","landrover"],
    ["Lexus","lexus"],
    ["Lotus","lotus"],
    ["Maserati","maserati"],
    ["Maybach","mercedes"],
    ["Mazda","mazda"],
    ["McLaren","mclaren"],
    ["Mercedes-Benz","mercedes"],
    ["MG","mg"],
    ["Mini","mini"],
    ["Mitsubishi","mitsubishi"],
    ["Nissan","nissan"],
    ["Opel","opel"],
    ["Pagani","pagani"],
    ["Peugeot","peugeot"],
    ["Polestar","polestar"],
    ["Porsche","porsche"],
    ["Ram","ram"],
    ["Renault","renault"],
    ["Rolls-Royce","rollsroyce"],
    ["Skoda","skoda"],
    ["Smart","smart"],
    ["Subaru","subaru"],
    ["Suzuki","suzuki"],
    ["Tesla","tesla"],
    ["Toyota","toyota"],
    ["Volkswagen","volkswagen"],
    ["Volvo","volvo"]

];


/* AFFICHAGE DES MARQUES */

const container = document.getElementById("brands");
const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");

let lettreActive = "all";

function afficherMarques() {

    container.innerHTML = "";

    const recherche = search.value.toLowerCase();

    const resultat = marques.filter(m => {

        const correspondRecherche =
            m[0].toLowerCase().includes(recherche);

        const correspondLettre =
            lettreActive === "all" ||
            m[0].toUpperCase().startsWith(lettreActive);

        return correspondRecherche && correspondLettre;

    });

    resultat.sort((a,b) => a[0].localeCompare(b[0], "fr"));

    count.textContent =
        resultat.length + " marque(s) trouvée(s)";

    empty.style.display =
        resultat.length ? "none" : "block";

    resultat.forEach(m => {

        const carte = document.createElement("div");
        carte.className = "brand";

        const image = document.createElement("img");

        image.src = "https://cdn.simpleicons.org/" + m[1];
        image.alt = "Logo " + m[0];

        const initial = document.createElement("div");
        initial.className = "initial";
        initial.textContent =
            m[0].replace(/[^A-Za-zÀ-ÿ]/g, "").substring(0,2).toUpperCase();

        image.onerror = () => {
            image.replaceWith(initial);
        };

        const nom = document.createElement("div");
        nom.className = "brand-name";
        nom.textContent = m[0];

        carte.appendChild(image);
        carte.appendChild(nom);

        carte.onclick = () => ouvrirDetails(m[0]);

        container.appendChild(carte);

    });
}


/* OUVRIR LES DETAILS */

function ouvrirDetails(nom) {

    document.getElementById("brandTitle").textContent = nom;

    document.getElementById("brandDescription").textContent =
        "Bienvenue dans l'espace consacré à " + nom +
        ". Les modèles et leurs fiches techniques seront ajoutés prochainement.";

    document.getElementById("details").style.display = "block";

    document.getElementById("details").scrollIntoView({
        behavior: "smooth"
    });

}


/* FERMER LES DETAILS */

function closeDetails() {
    document.getElementById("details").style.display = "none";
}


/* RECHERCHE */

search.addEventListener("input", afficherMarques);


/* FILTRES ALPHABETIQUES */

document.querySelectorAll(".filters button").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelector(".filters button.active")
            .classList.remove("active");

        button.classList.add("active");

        lettreActive = button.dataset.letter;

        afficherMarques();

    });

});


/* LANCEMENT DU SITE */

afficherMarques();

</script>

</body>
</html>
